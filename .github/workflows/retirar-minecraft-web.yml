name: Games - publicar catalogo sem Minecraft Web
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/retirar-minecraft-web.yml
permissions:
  contents: write
jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validar os tres catalogos
        run: |
          python3 - <<'PY'
          import json
          for name in ['catalog.json','catalog-v2.json','catalog-v3.json']:
              obj=json.load(open(name,encoding='utf8'))
              assert 'minecraft' not in obj['games'], name
          print('OK: catalogos sem jogo Web descontinuado')
          PY
      - name: Publicar catalogo atualizado e retirar artefato antigo
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != "lukasvisualls-dev/Games" ]];then exit 1;fi
          tag="games-catalog-sem-minecraft-web-2026-11-15"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1;then
            gh release create "$tag" catalog.json catalog-v2.json catalog-v3.json --repo "$GITHUB_REPOSITORY" --target main --title "Catalogo Games atualizado" --notes "Retirada da antiga edicao Web; outros jogos preservados." --latest
          fi
          ids=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '[.[] | .assets[] | select(.name == "minecraft.zip") | .id] | .[]')
          for id in $ids;do
            [[ "$id" =~ ^[0-9]+$ ]] || exit 1
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"
          done
          remaining=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '[.[] | .assets[] | select(.name == "minecraft.zip")] | length')
          test "$remaining" = 0
          gh release view "$tag" --repo "$GITHUB_REPOSITORY"
